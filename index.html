<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f9">
  <title>Sorun / Şikayet / Öneri / Sipariş · Tellboss</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #171820; background: #f5f6f9; }
    *, *::before, *::after { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(ellipse at 50% 6%, #e9eefc 0%, transparent 60%), #f5f6f9; }
    main { width: min(100%, 608px); padding: clamp(22px, 5vw, 42px); border: 1px solid #fff; border-radius: 34px; background: #ffffffed; box-shadow: 0 20px 70px #18284912, 0 2px 8px #18284908; }
    h1 { margin: 0 0 26px; text-align: center; text-wrap: balance; font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 720; letter-spacing: -.065em; line-height: 1.12; }
    h1 span { color: #72778a; font-weight: 430; }
    form { margin: 0; }
    .editor { position: relative; border: 1px solid #dfe2e9; border-radius: 22px; background: #f7f8fb; transition: border-color .16s ease, box-shadow .16s ease; }
    .editor:focus-within { border-color: #7195d6; box-shadow: 0 0 0 3px #457bda1c; }
    textarea { display: block; width: 100%; min-height: 172px; padding: 19px 75px 18px 18px; border: 0; border-radius: inherit; background: transparent; color: inherit; font: inherit; font-size: 1rem; line-height: 1.55; resize: vertical; }
    .editor:has(.mic[aria-expanded="true"]) textarea { min-height: 242px; }
    textarea:focus { outline: none; }
    textarea::placeholder { color: #626878; opacity: 1; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #175ac0; outline-offset: 4px; }
    .mic-anchor { position: absolute; top: 12px; right: 12px; z-index: 1; }
    .mic { display: grid; place-items: center; width: 50px; height: 50px; border: 1px solid #c9daf9; border-radius: 50%; background: #e7f0ff; color: #1551ae; transition: background .16s ease; }
    .mic:hover, .mic[aria-expanded="true"] { background: #d6e6ff; }
    .mic svg { display: block; }
    .dictation-help { position: absolute; top: calc(100% + 12px); right: 0; width: min(19.5rem, calc(100vw - 62px)); padding: 14px 16px; border: 1px solid #dce1ec; border-radius: 17px; background: #fff; box-shadow: 0 12px 36px #192d5529; color: #444b60; font-size: .875rem; line-height: 1.48; transform-origin: top right; animation: reveal-help .17s ease-out both; }
    .dictation-help::before { content: ''; position: absolute; top: -6px; right: 19px; width: 11px; height: 11px; border-top: 1px solid #dce1ec; border-left: 1px solid #dce1ec; border-radius: 2px 0 0; background: #fff; transform: rotate(45deg); }
    .dictation-help p { position: relative; margin: 0; }
    .dictation-help p + p { margin-top: 8px; }
    .dictation-help strong, #dictation-instruction { color: #1c2438; font-weight: 690; }
    .send { position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 53px; margin-top: 15px; padding: 10px 18px; overflow: hidden; border: 0; border-radius: 999px; background: linear-gradient(162deg, #0966d7, #0757bf); box-shadow: 0 6px 14px #145dc634, inset 0 1px 0 #ffffff3d; color: #fff; font-weight: 680; transition: box-shadow .16s ease, transform .16s ease; }
    .send:hover { box-shadow: 0 8px 19px #145dc647, inset 0 1px 0 #ffffff3d; }
    .send:active { transform: scale(.985); }
    .send-plane { flex: none; transition: transform .18s ease; }
    .send:is(:hover, :focus-visible) .send-plane { transform: translate(3px, -2px); }
    .send.is-sending .send-plane { animation: fly-plane .48s cubic-bezier(.22,.75,.34,1); }
    .message { margin: 12px 2px 0; color: #49536a; font-size: .9rem; line-height: 1.45; }
    .error { color: #8a2928; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    [hidden] { display: none !important; }
    @keyframes reveal-help { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes fly-plane { 0%, 100% { transform: none; opacity: 1; } 52% { transform: translate(30px, -21px); opacity: 0; } 53% { transform: translate(-12px, 9px); opacity: 0; } }
    @media (max-width: 600px) { body { align-items: start; padding-top: clamp(24px, 8svh, 65px); } main { padding: 25px 0; background: transparent; border: 0; box-shadow: none; } h1 { margin-bottom: 21px; } }
    @media (max-width: 400px) { .editor:has(.mic[aria-expanded="true"]) textarea { min-height: 268px; } }
    @media (prefers-reduced-motion: reduce) { .editor, .mic, .send, .send-plane { transition: none; } .dictation-help, .send.is-sending .send-plane { animation: none; } .send:active, .send:is(:hover, :focus-visible) .send-plane { transform: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Sorun <span>/</span> Şikayet <span>/</span> Öneri <span>/</span> Sipariş</h1>
    <form id="complaint-form">
      <div class="editor">
        <label class="sr-only" for="message">Mesajınız</label>
        <textarea id="message" rows="5" placeholder="Mesajınızı yazın veya siparişinizi söyleyin." required></textarea>
        <div class="mic-anchor" id="dictation-anchor">
          <button id="dictation" class="mic" type="button" aria-label="Telefon klavyesiyle sesli yaz" aria-controls="dictation-help" aria-expanded="false">
            <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 11v1a6 6 0 0 0 12 0v-1m-6 7v3m-3 0h6"/></svg>
          </button>
          <div class="dictation-help" id="dictation-help" hidden>
            <p id="dictation-instruction">Klavyedeki mikrofona dokunun.</p>
            <p><strong>Görünmüyorsa (iPhone):</strong> Ayarlar → Genel → Klavye → Dikte’yi Etkinleştir.</p>
            <p><strong>Görünmüyorsa (Android / Gboard):</strong> Klavyedeki Ayarlar → Sesle yazmayı aç.</p>
          </div>
        </div>
      </div>
      <button class="send" id="send" type="submit">
        <span>Gönder</span>
        <svg class="send-plane" id="send-plane" aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m21 3-6.5 18-3.9-7.6L3 9.5 21 3Zm0 0L10.6 13.4"/></svg>
      </button>
      <p class="message" id="feedback" role="status" hidden></p>
    </form>
    <noscript><p class="message error">Göndermek için tarayıcınızda JavaScript’i etkinleştirin.</p></noscript>
  </main>
  <script>
(() => {
const emailAddress = 'alperdigital@icloud.com';

const topics = [
  ['080', 'Güvenlik ve sağlık', 'Güvenlik', ['guvenlik*', 'tehlike*', 'yaralan*', 'yangin*', 'gaz kacag*', 'bayil*', 'zehirlen*', 'nefes alam*']],
  ['041', 'Yastık ve nevresim', 'Oda servisi', ['yastik*', 'yastig*', 'nevresim*', 'carsaf*', 'yorgan*', 'battaniye*']],
  ['042', 'Oda malzemeleri', 'Oda servisi', ['havlu*', 'sabun*', 'sampuan*', 'tuvalet kagid*', 'terlik*']],
  ['040', 'Temizlik ve hijyen', 'Kat hizmetleri', ['kirli*', 'temiz*', 'hijyen*', 'leke*', 'cop*']],
  ['051', 'Klima ve ısıtma', 'Teknik servis', ['klima*', 'kalorifer*', 'isitma*', 'sogutma*']],
  ['052', 'İnternet ve bağlantı', 'Teknik servis', ['internet*', 'wifi*', 'wi fi']],
  ['053', 'Elektrik ve aydınlatma', 'Teknik servis', ['elektrik*', 'priz*', 'lamba*', 'aydinlatma*']],
  ['054', 'Su ve tesisat', 'Teknik servis', ['sicak su', 'su yok', 'musluk*', 'tesisat*', 'dus']],
  ['031', 'Yiyecek ve içecek', 'Kafeterya', ['yemek*', 'yiyecek*', 'icecek*', 'kahve*', 'kahvalti*', 'kafeterya*', 'restoran*', 'menu*', 'porsiyon*']],
  ['010', 'Ödeme ve ücret', 'Resepsiyon', ['hesap*', 'odeme*', 'ucret*', 'fatura*', 'iade*', 'pahali*', 'pos']],
  ['071', 'Rezervasyon ve giriş', 'Resepsiyon', ['rezervasyon*', 'resepsiyon*', 'check in', 'check out']],
  ['070', 'Personel ve iletişim', 'Misafir ilişkileri', ['personel*', 'calisan*', 'kaba*', 'hakaret*', 'garson*', 'ilgisiz*', 'musteri hizmet*']],
  ['060', 'Sipariş ve teslimat', 'Oda servisi', ['siparis*', 'teslimat*', 'kurye*', 'paket*']],
  ['091', 'Gürültü', 'Misafir ilişkileri', ['gurultu*', 'yuksek ses', 'uyuyama*']],
  ['100', 'Erişilebilirlik', 'Misafir ilişkileri', ['engelli*', 'tekerlekli sandalye*', 'erisim*', 'rampa*', 'asansor*']],
];
const generalTopics = [
  ['050', 'Teknik sorun', 'Teknik servis', ['ariza*', 'bozuk*', 'calismi*', 'uygulama*']],
  ['030', 'Ürün ve hizmet kalitesi', 'Misafir ilişkileri', ['urun*', 'kalite*', 'bayat*']],
  ['020', 'Servis ve bekleme', 'Misafir ilişkileri', ['bekle*', 'gecik*', 'yavas*', 'sira*', 'servis*']],
  ['090', 'Ortam ve tesis', 'Misafir ilişkileri', ['havalandirma*', 'otopark*', 'tesis*', 'koridor*']],
];
const otherTopic = ['000', 'Genel konu', 'Misafir ilişkileri'];
const orderTopic = ['031', 'Yiyecek ve içecek', 'Kafeterya'];
const orderNoteTopic = ['032', 'Sipariş notu', 'Kafeterya'];
const emotions = [
  ['3', 'Endişe', ['endise*', 'kork*', 'panik*', 'kaygi*', 'tedirgin*']],
  ['1', 'Öfke', ['sinirli*', 'ofke*', 'kizgin*', 'rezalet*', 'skandal*', 'kabul edilemez']],
  ['2', 'Hayal kırıklığı veya üzüntü', ['hayal kiriklig*', 'uzgun*', 'uzuldum', 'memnun degil*', 'maalesef']],
  ['4', 'Memnuniyet', ['tesekkur*', 'memnun kald*', 'harika*', 'begendim', 'cok iyi']],
];

const types = {
  problem: ['1', 'Sorun'],
  complaint: ['2', 'Şikayet'],
  suggestion: ['3', 'Öneri'],
  order: ['4', 'Sipariş'],
};
const suggestionTerms = ['oneri*', 'tavsiye*', 'olsa iyi olur', 'iyilestir*'];
const complaintTerms = ['sikayet*', 'memnun degil*', 'memnun kalmadi*', 'hayal kiriklig*', 'rezalet*', 'kabul edilemez', 'magdur*', 'berbat*', 'kotu', 'kotuy*', 'bayat*', 'kirli*'];
const criticalTerms = ['yangin*', 'gaz kacag*', 'bayil*', 'zehirlen*', 'nefes alam*'];

function searchable(text) {
  return ' ' + text.toLocaleLowerCase('tr')
    .normalize('NFD').replace(/\p{M}/gu, '').replaceAll('ı', 'i')
    .replace(/[^\p{L}\p{N}]+/gu, ' ').trim() + ' ';
}

function score(text, expressions) {
  return expressions.filter(expression => {
    return expression.endsWith('*')
      ? text.includes(' ' + expression.slice(0, -1))
      : text.includes(' ' + expression + ' ');
  }).length;
}

function bestRule(text, rules) {
  let best;
  let bestScore = 0;
  for (const rule of rules) {
    const matches = score(text, rule.at(-1));
    if (matches > bestScore) {
      best = rule;
      bestScore = matches;
    }
  }
  return best;
}

function withoutNegatedAlerts(text) {
  return text
    .replace(/ (?:acil degil(?:dir)?|yangin yok(?:tur)?|gaz kacag[ıi]? yok(?:tur)?|bayilmadi\w*|zehirlenmedi\w*)(?= )/g, '');
}

function classifyType(text) {
  if (score(text, complaintTerms)) return types.complaint;
  if (score(text, suggestionTerms)) return types.suggestion;
  return types.problem;
}

function classifyTopic(text) {
  const topic = bestRule(text, topics);
  if (topic) return topic;
  if (menuMatches(orderWords(text)).length) return orderTopic;
  return bestRule(text, generalTopics) ?? otherTopic;
}

function splitItems(original) {
  const items = [];
  const sentences = original.split(/\s*[;\r\n]+\s*|(?<=[.!?])\s+/u);
  for (const [sentenceIndex, sentence] of sentences.entries()) {
    let declaredType;
    const sentenceHasOrder = menuMatches(orderWords(sentence)).some(product => product.quantity);
    const fragments = sentence.split(/\s*,\s*|\s+(?:ama|ancak|fakat|ayrıca|bir de|öte yandan|bunun yanında)\s+/iu)
      .flatMap(splitOrderConjunctions);
    for (const fragment of fragments) {
      const part = fragment.trim().replace(/^(?:[-•*]|\d+[.)])\s+/u, '');
      if (!/[\p{L}]/u.test(part)) continue;

      const label = part.match(/^(?:\d+\s+)?(şik[aâ]yet(?:lerim|im|ler)?|öneri(?:lerim|m|ler)?|sorun(?:larım|um|lar)?|sipariş(?:im|lerim)?)(?:\s+(?:var|şu))?\s*[:–—-]\s*/iu)
        ?? part.match(/^(şik[aâ]yetim|önerim|sorunum)(?:\s+|$)/iu);
      if (label) {
        const marker = searchable(label[1]).trim();
        declaredType = marker.startsWith('sikayet') ? types.complaint
          : marker.startsWith('oneri') ? types.suggestion
            : marker.startsWith('siparis') ? types.order : types.problem;
      }

      const body = label ? part.slice(label[0].length) : part;
      const normalized = withoutNegatedAlerts(searchable(body));
      const explicitOrder = declaredType === types.order;
      if (explicitOrder && !body) continue;
      if ((!label || explicitOrder) && parseOrderPart(body, explicitOrder, items, sentenceHasOrder)) continue;
      const topic = classifyTopic(normalized);
      const declaredReportType = explicitOrder ? undefined : declaredType;
      const inferredType = declaredReportType ?? classifyType(normalized);
      const previous = items.at(-1);
      const hasSeparateType = (label && previous?.text)
        || (inferredType === types.suggestion && previous?.type !== types.suggestion)
        || (inferredType === types.complaint && previous?.type === types.suggestion);
      const isContinuation = /^ (?:bu yuzden|bu nedenle|bunun uzerine|ornek olarak|ornegin) /u.test(normalized);
      const isRelatedGeneralTopic = previous && previous.topic !== topic && generalTopics.includes(topic)
        && previous.sentenceIndex === sentenceIndex
        && previous.topic[0].slice(0, 2) === topic[0].slice(0, 2);
      const hasSeparateTopic = previous && topic !== otherTopic && previous.topic !== otherTopic
        && (topic !== previous.topic || previous.sentenceIndex !== sentenceIndex) && !isContinuation && !isRelatedGeneralTopic;

      if (!previous || previous.order || hasSeparateType || hasSeparateTopic) {
        items.push({ text: body, topic, type: inferredType, declaredType: declaredReportType, sentenceIndex });
        continue;
      }

      previous.text = [previous.text, body].filter(Boolean).join(' ');
      if (previous.topic === otherTopic) previous.topic = topic;
      previous.type = previous.declaredType ?? classifyType(searchable(previous.text));
    }
  }

  return items.filter(item => item.text);
}

function serializeItem(item, position) {
  const text = searchable(item.text);
  const urgencyText = withoutNegatedAlerts(text);
  const urgency = score(urgencyText, criticalTerms) ? 'Kritik'
    : score(urgencyText, ['acil', 'acilen', 'hemen', 'derhal', 'bugun icinde']) ? 'Acil' : '';
  const [topicCode, topicName, department] = item.topic;
  const [typeCode, typeName] = item.type;
  const baseCode = typeCode + topicCode + String(position).padStart(2, '0');
  if (item.order) {
    const order = standardOrder(item.order);
    return {
      code: '0.' + baseCode + '00',
      fields: [['Tür', typeName], ['Departman', department], ...order.fields, ['Aciliyet', urgency]],
      details: order.hasUnlistedValues ? orderSummary(item.order).join(' · ') : '',
    };
  }
  const emotion = bestRule(text, emotions);
  const highIntensity = score(text, ['dayanilmaz*', 'rezalet*', 'skandal*', 'kesinlikle kabul edilemez', 'defalarca']);
  const moderateIntensity = score(text, ['cok', 'tekrar', 'kabul edilemez', 'ciddi*', 'maalesef']);
  const intensityCode = highIntensity || /[!?]{3,}/u.test(item.text) ? '3'
    : moderateIntensity || emotion?.[0] === '1' ? '2' : '1';
  return {
    code: '0.' + baseCode + intensityCode + (emotion?.[0] ?? '0'),
    fields: [['Tür', typeName], ['Departman', department], ['Konu', topicName], ['Aciliyet', urgency]],
  };
}

function mailDraft(original) {
  const items = splitItems(original);
  if (!items.length) items.push({ text: original, topic: otherTopic, type: types.problem });
  const records = items.map((item, index) => serializeItem(item, index + 1));
  const subject = records.map(record => [record.code, ...record.fields
    .filter(([, value]) => value !== '' && value !== undefined)
    .map(([key, value]) => key + '=' + value)].join(' · ')).join(' | ');
  const details = records.filter(record => record.details).map(record => record.code + ' · ' + record.details);
  const body = details.length ? [original, '', 'Sipariş ayrıntıları', ...details].join('\n') : original;
  return 'mailto:' + emailAddress + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body.replace(/\r\n?|\n/g, '\r\n').toWellFormed());
}

const menu = [
  ['Türk kahvesi', /^turk kahves(?:i|ini|ine)$/u],
  ['Filtre kahve', /^filtre kahve(?:yi|ye)?$/u],
  ['Meyve suyu', /^meyve suyu(?:nu|na)?$/u],
  ['Sıcak çikolata', /^sicak cikolata(?:yi|ya)?$/u],
  ['Çiğ köfte', /^cig kofte(?:yi|ye|ler|leri)?$/u],
  ['Kulüp sandviç', /^kulup sandvic(?:i|e|in|te)?$/u],
  ['Çay', /^cay(?:i|a|dan|lar|lari)?$/u],
  ['Kahve', /^(?:kahve(?:yi|ye|ler)?|espresso|latte|cappuccino|americano)$/u],
  ['Sandviç', /^sandvic(?:i|e|in|te|ten|ler|leri)?$/u],
  ['Tost', /^tost(?:u|a|un|ta|lar)?$/u],
  ['Su', /^su(?:yu|ya|yun)?$/u],
  ['Soda', /^soda(?:yi|ya)?$/u],
  ['Limonata', /^limonata(?:yi|ya)?$/u],
  ['Ayran', /^ayran(?:i|a)?$/u],
  ['Makarna', /^makarna(?:yi|ya)?$/u],
  ['Çorba', /^corba(?:yi|ya)?$/u],
  ['Salata', /^salata(?:yi|ya)?$/u],
  ['Burger', /^(?:hamburger|burger)(?:i|e)?$/u],
  ['Pizza', /^pizza(?:yi|ya)?$/u],
  ['Döner', /^doner(?:i|e)?$/u],
  ['Mantı', /^manti(?:yi|ya)?$/u],
  ['Kruvasan', /^kruvasan(?:i|a)?$/u],
  ['Dondurma', /^dondurma(?:yi|ya)?$/u],
  ['Tiramisu', /^tiramisu(?:yu|ya)?$/u],
];
const units = new Set(['adet', 'tane', 'porsiyon', 'bardak', 'fincan', 'sise']);
const descriptions = new Set(['buyuk', 'orta', 'kucuk', 'sade', 'demli', 'acik', 'sicak', 'soguk', 'duble']);
const optionScope = new Set(['icinde', 'icine', 'icinden', 'icini', 'uzerine', 'uzerinde', 'yanina', 'yaninda', 'icin', 'lutfen', 'da', 'de', 'biraz', 'ekstra', 'ilave']);
const ignoredOptions = new Set(['acil', 'cabuk', 'hemen', 'hazir', 'tesekkurler', 'sicak', 'soguk']);
const numberWords = new Map([
  ['bir', 1], ['iki', 2], ['uc', 3], ['dort', 4], ['bes', 5], ['alti', 6], ['yedi', 7], ['sekiz', 8], ['dokuz', 9],
  ['on', 10], ['yirmi', 20], ['otuz', 30], ['kirk', 40], ['elli', 50], ['altmis', 60], ['yetmis', 70], ['seksen', 80], ['doksan', 90],
]);
const requestTerms = ['istiyorum', 'istiyoruz', 'alabilir miyim', 'alabilir miyiz', 'alalim', 'alabilirsem', 'getirin', 'getirir misiniz', 'getirebilir misiniz', 'verir misiniz', 'rica ediyorum', 'rica ederim', 'siparis vermek istiyorum'];
const endOfProductName = new Set([...requestTerms.map(term => term.split(' ')[0]), 'icine', 'icinde', 'icinden', 'uzerine', 'yanina', 'icin', 'lutfen', 'ekstra', 'ilave']);
const nonOrderCount = /^(?:(?:saat|dakika|saniye|gun|gece|hafta|ay|yil|kisi|oda|numara)(?:dir|dur|lik|larda|dan|den|lar)?|numarali|kat|lira|tl|defa|kere|kez|bardakta|fotograf|telefon|mesaj|konu|sikinti|sey|problem|sorun)$/u;
const reportWords = /(?:^| )(?:var|yok|geldi|geldiler|kaldik|kaldim|bekledim|bekledik|gorustum|yasadim)(?= )/u;
const pastOrderTerms = ['gelmedi*', 'yanlis', 'eksik', 'fazla geldi', 'soguk geldi', 'soguktu', 'gec geldi', 'aldim', 'aldik', 'istedim', 'istedik', 'demistim', 'siparis ettim', 'siparis verdim', 'siparis verdik', 'iade*', 'gecikti*'];
const foodOptions = new Set(['tursu', 'sogan', 'kasar', 'ketcap', 'mayonez', 'domates', 'marul', 'hardal']);
const drinks = new Set(['Çay', 'Kahve', 'Türk kahvesi', 'Filtre kahve', 'Meyve suyu', 'Sıcak çikolata', 'Su', 'Soda', 'Limonata', 'Ayran']);

function orderWords(text) {
  return [...text.matchAll(/[\p{L}\p{M}\p{N}]+/gu)].map(([raw]) => ({ raw, key: searchable(raw).trim() }));
}

function quantityAt(words, index) {
  const word = words[index]?.key;
  if (!word) return;
  if (/^[1-9]\d{0,2}$/u.test(word)) return { value: Number(word), start: index };
  if (word === 'yarim') return { value: '½', start: index };
  const amount = numberWords.get(word);
  if (amount === undefined) return;
  const previous = numberWords.get(words[index - 1]?.key);
  if (amount < 10 && previous >= 10) return { value: previous + amount, start: index - 1 };
  return { value: amount, start: index };
}

function suffixOption(word) {
  const excluded = word.key.match(/^(.{2,})(?:siz|suz)$/u);
  if (excluded && !/^(?:eksik|tad|tat|gerek|ses|istek)$/u.test(excluded[1])) {
    return { kind: 'Hariç', value: word.raw.slice(0, -3) };
  }
  const included = word.key.match(/^(sucuk|peynir|kasar|sut|seker|tavuk|buz|domates|zeytin|aci)(?:li|lu)$/u);
  if (included) return { kind: 'İçerik', value: word.raw.slice(0, -2) };
}

function menuMatches(words) {
  const found = [];
  for (let index = 0; index < words.length; index++) {
    const pair = words.slice(index, index + 2).map(word => word.key).join(' ');
    const double = menu.find(([, pattern]) => pair.includes(' ') && pattern.test(pair));
    const single = double ?? menu.find(([, pattern]) => pattern.test(words[index].key));
    if (!single) continue;

    const end = index + (double ? 2 : 1);
    let before = index - 1;
    const modifiers = [];
    const modifierIndices = [];
    const descriptionsFound = [];
    while (before >= 0) {
      const option = suffixOption(words[before]);
      if (option) {
        modifiers.unshift(option);
        modifierIndices.push(before);
      } else if (descriptions.has(words[before].key)) {
        descriptionsFound.unshift(words[before].raw);
      } else break;
      before--;
    }
    let unit = units.has(words[before]?.key) ? words[before--].raw : '';
    let quantity = quantityAt(words, before);
    if (!quantity && (end === words.length - 1 || units.has(words[end + 1]?.key))) {
      quantity = quantityAt(words, end);
      if (quantity && units.has(words[end + 1]?.key)) unit = words[end + 1].raw;
    }
    if (!found.length && quantity?.start < index && words.slice(0, quantity.start).every(word => suffixOption(word))) {
      for (let offset = quantity.start - 1; offset >= 0; offset--) {
        const option = suffixOption(words[offset]);
        if (!option) break;
        modifiers.unshift(option);
        modifierIndices.push(offset);
      }
    }
    const catalogName = single[0] === 'Kahve' && !words[index].key.startsWith('kahve')
      ? words[index].raw
      : single[0];
    const displayName = [...descriptionsFound, catalogName].join(' ');
    found.push({ name: catalogName, displayName, preparations: descriptionsFound, start: index, end, quantity, unit, modifiers, modifierIndices });
    if (double) index++;
  }
  return found;
}

function quantitySpans(words) {
  const spans = new Map();
  for (const [index] of words.entries()) {
    const quantity = quantityAt(words, index);
    if (quantity) spans.set(quantity.start, { ...quantity, end: index + 1 });
  }
  return [...spans.values()];
}

function addUnlistedProducts(words, known, inOrderContext) {
  const quantities = quantitySpans(words);
  const looksLikeList = quantities.length > 1 && quantities[0].start === 0;
  const extra = [];
  for (const [index, quantity] of quantities.entries()) {
    if (known.some(product => product.quantity?.start === quantity.start)) continue;

    const unit = units.has(words[quantity.end]?.key) ? words[quantity.end].raw : '';
    const start = quantity.end + (unit ? 1 : 0);
    if (nonOrderCount.test(words[start]?.key ?? '')) continue;
    const nextProduct = known.find(product => product.quantity && product.start >= start);
    let end = Math.min(quantities[index + 1]?.start ?? words.length, nextProduct?.start ?? words.length);
    for (let offset = start; offset < end; offset++) {
      const word = words[offset].key;
      if (endOfProductName.has(word) || prepAction(word)) { end = offset; break; }
    }
    while (end > start && /^(?:ve|da|de)$/u.test(words[end - 1].key)) end--;
    if (end <= start) continue;

    const nameWords = [];
    const modifiers = [];
    const modifierIndices = [];
    for (let offset = start; offset < end; offset++) {
      const option = suffixOption(words[offset]);
      if (option) {
        modifiers.push(option);
        modifierIndices.push(offset);
      } else {
        nameWords.push(words[offset].raw);
      }
    }
    const name = nameWords.join(' ');
    const normalizedName = searchable(name);
    const topic = bestRule(normalizedName, topics) ?? bestRule(normalizedName, generalTopics);
    if (!name || reportWords.test(normalizedName) || (topic && topic[0] !== orderTopic[0])) continue;
    if (!inOrderContext && !unit && !looksLikeList && (quantity.start !== 0 || nameWords.length > 5 || end !== words.length)) continue;

    extra.push({ name, start, end, quantity, unit, modifiers, modifierIndices });
  }
  return known.filter(product => product.quantity || !extra.some(item => item.start <= product.start && item.end >= product.end))
    .concat(extra).sort((first, second) => first.start - second.start);
}

function prepAction(word) {
  if (/^(?:koymayin|koyma|eklemeyin|ekleme|olmasin|olmadan|haric|istemiyorum|istemiyoruz|cikarin|cikar|koyulmasin|konmasin)$/u.test(word)) return 'Hariç';
  if (/^(?:koyun|koy|ekleyin|ekle|olsun)$/u.test(word)) return 'İçerik';
}

function splitOrderConjunctions(chunk) {
  const fragments = [];
  for (const part of chunk.split(/\s+ve\s+/iu)) {
    const left = fragments.at(-1);
    const rightWords = orderWords(part);
    const leftWords = left ? orderWords(left) : [];
    const leftTopic = left ? classifyTopic(searchable(left)) : otherTopic;
    const continuesIngredients = left && rightWords.some(word => prepAction(word.key))
      && !menuMatches(rightWords).length && !leftWords.some(word => prepAction(word.key))
      && (leftTopic === otherTopic || leftTopic === orderTopic || leftWords.some(word => word.key === 'icine'));
    if (continuesIngredients) fragments[fragments.length - 1] = left + ' ve ' + part;
    else fragments.push(part);
  }
  return fragments;
}

function prepOptions(words, products) {
  const result = [];
  let lastAction = -1;
  for (const [index, word] of words.entries()) {
    const action = prepAction(word.key) ?? (word.key === 'edin' && words[index - 1]?.key === 'ilave' ? 'İçerik' : undefined);
    if (action) {
      const before = products.findLast(product => product.end <= index);
      const start = Math.max(lastAction + 1, before?.end ?? 0);
      const ingredient = words.slice(start, index)
        .filter(item => !optionScope.has(item.key) && !ignoredOptions.has(item.key) && !suffixOption(item));
      if (ingredient.length) {
        result.push({ kind: action, value: ingredient.map(item => item.raw).join(' '), target: before?.name });
      }
      lastAction = index;
      continue;
    }

    if (word.key === 'ekstra' && index + 1 < words.length && !products.some(product => product.start === index + 1)
      && !words.slice(index + 1).some(item => prepAction(item.key) || item.key === 'edin')) {
      const before = products.findLast(product => product.end <= index);
      result.push({ kind: 'İçerik', value: words[index + 1].raw, target: before?.name });
      continue;
    }

    const option = suffixOption(word);
    if (!option) continue;
    if (products.some(product => product.modifierIndices.includes(index))) continue;
    const before = products.findLast(product => product.end <= index);
    result.push({ ...option, target: before?.name });
  }

  return result;
}

function appendOptions(order, options) {
  for (const option of options) {
    if (!order.modifiers.some(existing => existing.kind === option.kind && searchable(existing.value) === searchable(option.value))) {
      order.modifiers.push({ kind: option.kind, value: option.value });
    }
  }
}

function parseOrderPart(body, explicit, items, sentenceHasOrder) {
  const words = orderWords(body);
  if (!words.length) return false;
  const text = searchable(body);
  if (score(text, pastOrderTerms) || classifyType(text) === types.complaint) return false;
  const latestOrders = [];
  for (let index = items.length - 1; index >= 0 && items[index].order; index--) {
    latestOrders.push(items[index].order);
  }

  const request = score(text, requestTerms);
  const known = menuMatches(words);
  const products = addUnlistedProducts(words, known, explicit || request || sentenceHasOrder || latestOrders.length > 0);
  const options = prepOptions(words, products);
  const productNumber = products.some(product => product.quantity);
  const plainProduct = products.length === 1 && products[0].end === words.length && products[0].start === 0;
  const hasOrderCue = explicit || request || productNumber || options.length || plainProduct || products.some(product => product.modifiers.length)
    || (products.length && words.some(word => prepAction(word.key) === 'İçerik'));
  if (products.length && words.some(word => prepAction(word.key) === 'Hariç') && !options.length && !products.some(product => product.modifiers.length)) {
    for (const product of products) {
      const removed = latestOrders.filter(order => order.name === product.name);
      for (const order of removed) {
        const index = items.findIndex(item => item.order === order);
        items.splice(index, 1);
      }
    }
    const order = { name: 'Sipariş notu', modifiers: products.map(product => ({ kind: 'Hariç', value: product.name })) };
    items.push({ text: body, type: types.order, topic: orderNoteTopic, order });
    return true;
  }
  if (!hasOrderCue) return false;

  for (const product of products) {
    const existing = latestOrders.find(order => order.name === product.name);
    const isModification = !product.quantity && !request && options.some(option => option.target === product.name);
    if (existing && isModification) continue;
    const order = { name: product.name, displayName: product.displayName, preparations: product.preparations, quantity: product.quantity?.value, unit: product.unit, modifiers: product.modifiers };
    items.push({ text: body, type: types.order, topic: orderTopic, order });
    latestOrders.unshift(order);
  }

  if (options.length) {
    let note;
    for (const option of options) {
      const compatible = foodOptions.has(searchable(option.value).trim())
        ? latestOrders.filter(order => !drinks.has(order.name) && order.name !== 'Sipariş notu') : [];
      const candidates = option.target ? latestOrders.filter(order => order.name === option.target)
        : compatible.length ? compatible : latestOrders;
      if (candidates.length === 1) {
        appendOptions(candidates[0], [option]);
      } else {
        if (!note) {
          note = { name: 'Sipariş notu', modifiers: [] };
          items.push({ text: body, type: types.order, topic: orderNoteTopic, order: note });
        }
        appendOptions(note, [option]);
      }
    }
    return true;
  }

  if (products.length) return true;
  if (!explicit) return false;
  const topic = classifyTopic(text);
  if (topic !== otherTopic && topic[0] !== orderTopic[0]) return false;
  const firstQuantity = quantityAt(words, 1);
  const quantity = firstQuantity?.start === 0 ? firstQuantity : quantityAt(words, 0);
  const count = quantity && (quantity.start === 0) ? quantity.value : undefined;
  const afterCount = count ? (firstQuantity?.start === 0 ? 2 : 1) : 0;
  const unit = units.has(words[afterCount]?.key) ? words[afterCount].raw : '';
  const name = words.slice(afterCount + (unit ? 1 : 0)).map(word => word.raw).join(' ');
  const order = { name: name || 'Sipariş talebi', quantity: count, unit, modifiers: [] };
  items.push({ text: body, type: types.order, topic: orderTopic, order });
  return true;
}

function orderSummary(order) {
  const product = order.displayName ?? order.name;
  const name = order.quantity
    ? order.quantity + (order.unit ? ' ' + order.unit + ' ' : ' × ') + product
    : product;
  const details = ['İçerik', 'Hariç'].flatMap(kind => {
    const values = order.modifiers.filter(option => option.kind === kind).map(option => option.value);
    return values.length ? [kind + ' (' + values.join(', ') + ')'] : [];
  });
  return [name, ...details];
}

function canonicalLabels(labels) {
  return new Map(labels.map(label => [searchable(label).trim(), label]));
}

const productLabels = canonicalLabels([...menu.map(([name]) => name), 'Espresso', 'Latte', 'Cappuccino', 'Americano', 'Sipariş notu']);
const unitLabels = canonicalLabels(['Adet', 'Tane', 'Porsiyon', 'Bardak', 'Fincan', 'Şişe']);
const preparationLabels = canonicalLabels(['Büyük', 'Orta', 'Küçük', 'Sade', 'Demli', 'Açık', 'Sıcak', 'Soğuk', 'Duble']);
const ingredientLabels = canonicalLabels([
  'Acı', 'Biber', 'Buz', 'Domates', 'Hardal', 'Kapari', 'Kaşar', 'Ketçap', 'Kırmızı soğan', 'Limon', 'Marul',
  'Mayonez', 'Peynir', 'Roka', 'Salatalık', 'Sarımsak', 'Soğan', 'Sos', 'Sucuk', 'Süt', 'Şeker', 'Tavuk',
  'Turşu', 'Tuz', 'Zeytin', 'Zeytinyağı',
]);
const ingredientAliases = new Map([
  ['tursuyu', 'Turşu'], ['tursuyu da', 'Turşu'], ['sogani', 'Soğan'], ['kasari', 'Kaşar'], ['domatesi', 'Domates'],
  ['sekeri', 'Şeker'], ['sutu', 'Süt'], ['buzu', 'Buz'], ['tuzu', 'Tuz'], ['peyniri', 'Peynir'],
]);

function standardOrder(order) {
  const product = productLabels.get(searchable(order.name).trim());
  let hasUnlistedValues = !product;
  const quantity = Number.isSafeInteger(order.quantity) && order.quantity > 0 ? order.quantity
    : order.quantity === '½' ? '0.5' : 'Belirtilmedi';
  const fields = [
    ['Ürün', product ?? 'Diğer'],
    ['Adet', quantity],
    ['Birim', order.unit ? unitLabels.get(searchable(order.unit).trim()) : undefined],
    ['Hazırlama', (order.preparations ?? []).map(name => preparationLabels.get(searchable(name).trim())).filter(Boolean).join(', ')],
  ];

  for (const kind of ['İçerik', 'Hariç']) {
    const values = new Set();
    for (const option of order.modifiers.filter(modifier => modifier.kind === kind)) {
      for (const part of option.value.split(/\s+(?:ve|ile)\s+|\s*,\s*/iu)) {
        const key = searchable(part).trim();
        if (!key) continue;
        const label = ingredientLabels.get(key) ?? ingredientAliases.get(key) ?? productLabels.get(key);
        if (!label) hasUnlistedValues = true;
        values.add(label ?? 'Diğer');
      }
    }
    fields.push([kind, [...values].sort((first, second) => first.localeCompare(second, 'tr')).join(', ')]);
  }
  return { fields, hasUnlistedValues };
}

const form = document.getElementById('complaint-form');
const message = document.getElementById('message');
const dictation = document.getElementById('dictation');
const dictationHelp = document.getElementById('dictation-help');
const dictationAnchor = document.getElementById('dictation-anchor');
const feedback = document.getElementById('feedback');
const send = document.getElementById('send');
const sendPlane = document.getElementById('send-plane');

function showFeedback(text, error = false) {
  feedback.textContent = text;
  feedback.hidden = !text;
  feedback.classList.toggle('error', error);
}

function setDictationOpen(open) {
  dictationHelp.hidden = !open;
  dictation.setAttribute('aria-expanded', String(open));
  if (open) {
    message.setAttribute('aria-describedby', 'dictation-instruction');
  } else {
    message.removeAttribute('aria-describedby');
  }
}

dictation.addEventListener('click', () => {
  const opening = dictationHelp.hidden;
  setDictationOpen(opening);
  if (opening) message.focus({ preventScroll: true });
});

document.addEventListener('click', event => {
  if (!dictationHelp.hidden && !dictationAnchor.contains(event.target)) setDictationOpen(false);
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !dictationHelp.hidden) {
    setDictationOpen(false);
    dictation.focus();
  }
});

message.addEventListener('input', () => {
  message.setCustomValidity('');
  showFeedback('');
  if (!dictationHelp.hidden) setDictationOpen(false);
});

sendPlane.addEventListener('animationend', () => send.classList.remove('is-sending'));

form.addEventListener('submit', event => {
  event.preventDefault();
  const original = message.value;

  if (!original.trim()) {
    message.setCustomValidity('Lütfen mesajınızı yazın.');
    message.reportValidity();
    return;
  }

  const draft = mailDraft(original);
  send.classList.add('is-sending');
  showFeedback('Göndermeden önce konu satırını e-posta uygulamanızda düzenleyebilirsiniz.');
  window.location.href = draft;
});

})();
</script>
